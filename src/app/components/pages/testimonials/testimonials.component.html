<!-- <section class="relative py-16 bg-gradient-to-t from-orange-500/20 to-white"> -->
<section class="relative flex justify-center items-center flex-col py-16 ">
  <h2 class="text-3xl font-bold text-center text-[#f5284a] uppercase mb-5">Lo que dicen nuestro clientes</h2>
  <div class="max-w-4xl mx-auto px-6">
    <!-- Testimonio -->
     @for (item of testimonials; track $index) {
    <div class="bg-white rounded-2xl shadow-xl p-10 text-center transition-all duration-500 border border-gray-200" 
          [class.hidden]="$index !== currentIndex">    
      <p class="text-lg md:text-xl text-gray-700 italic mb-6">
        “{{ item.text }}”
      </p>
      <div class="mt-4">
        <h4 class="font-semibold text-gray-900">{{ item.name }}</h4>
        <p class="text-sm text-gray-500">{{ item.role }}</p>
      </div>
      <!-- Avatar -->
      <div class="flex justify-center mt-6">
        <img [src]="item.avatar" alt="{{ item.name }}" class="w-14 h-14 rounded-full border-2 border-[#e14149] shadow"
        />
      </div>
    </div>
    }
    <!-- Controles -->
    <div class="flex justify-center items-center gap-4 mt-8">
      <button (click)="prev()" class="p-2 rounded-full bg-[#e14149] hover:bg-[#ec1823] shadow cursor-pointer">
        <img src="assets/images/icons/chevron_left.svg" alt="Siguiente">
      </button>
      <div class="flex space-x-2">
        @for (item of testimonials; track $index) {
          <button (click)="goToSlide($index)" [class.bg-red-500]="$index === currentIndex"
            class="w-3 h-3 rounded-full bg-gray-300 transition cursor-pointer"
          ></button>
        }       
      </div>
      <button (click)="next()" class="p-2 rounded-full bg-[#e14149] hover:bg-[#ec1823]  shadow cursor-pointer">
        <img src="assets/images/icons/chevron_right.svg" alt="Atrás">
      </button>
    </div>
  </div>
</section>
