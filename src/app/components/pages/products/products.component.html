<section class="w-full px-4 py-16">
  <h2 class="text-3xl font-bold text-center mb-12 text-[#f5284a] uppercase">Productos del Momento</h2>

  <div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3 place-items-center">       
 
    @for (item of productos; track item.id) {
    <div class="md:w-80 bg-white rounded-lg shadow-md overflow-hidden hover:shadow-2xl transition duration-300">
        <img 
          [src]="item.picture"
          [alt]="item.name"
          class="w-full h-56 object-cover" lazyload="lazy"
        />
  
        <div class="p-4">
          <h3 class="text-lg font-semibold text-gray-800">{{ item.name }}</h3>
          <p class="text-sm text-gray-600 mt-1">{{ item.description }}</p>
  
          <div class="flex items-center gap-2 mt-3">
            @if (item.previousPrice) {
              <span class="text-sm text-gray-400 line-through">S/ {{ item.previousPrice.toFixed(2) }}</span>
            }
            <span class="text-lg font-bold text-[#f5284a]">S/ {{ item.price.toFixed(2) }}</span>
          </div>
  
          <button (click)="addToCart(item)"
            class="mt-4 w-full bg-[#f5284a] text-white py-2 rounded-lg hover:bg-[#fc516d] transition">
            Agregar al carrito
          </button>
        </div>
      </div> 
      }      
  </div>
</section>
